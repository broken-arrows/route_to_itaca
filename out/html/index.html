        <div class="overlay_top" style="max-width: fit-content;">
            <table>
                <tr>
                    <td>
                        Backgrounds:
                    </td>
                    <td style="cursor: pointer">
                        <label for="backgrounds_yes">On</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="backgrounds_yes" name="backgrounds" value="1" onclick="window.enableBg();">
                    </td>
                    <td style="cursor: pointer">
                        <label for="backgrounds_no">Off</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="backgrounds_no" name="backgrounds" value="0" onclick="window.disableBg();">
                    </td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        Event images:
                    <td style="cursor: pointer">
                        <label for="images_yes">On</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="images_yes" name="images" value="1" onclick="window.enableImages();">
                    </td>
                    <td style="cursor: pointer">
                        <label for="images_no">Off</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="images_no" name="images" value="0" onclick="window.disableImages();">
                    </td>
                </tr>
                <tr>
                    <td></td>
                </tr>
 
                <tr>
                    <td>
                        Animations:
                    </td>

                        <label for="animate_yes">On</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="animate_yes" name="animate" value="1" onclick="window.enableAnimate();">
                    </td>
                    <td style="cursor: pointer">
                        <label for="animate_no">Off</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="animate_no" name="animate" value="0" onclick="window.disableAnimate();">
                    </td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        Music (WIP):
                    </td>
                    <td style="cursor: not-allowed;">
                        <label for="audio_yes" style="color: grey">On</label>
                    </td>
                    <td style="cursor: not-allowed;">
                        <input type="radio" id="audio_yes" name="audio" value="1" onclick="window.enableAudio();" disabled>
                    </td>
                    <td style="cursor: pointer">
                        <label for="audio_no">Off</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="audio_no" name="audio" value="0" onclick="window.disableAudio();">
                    </td>
                </tr>
                <tr>
                    <td></td>
                </tr>

                <tr>
                    <td>
                        Color mode (WIP):
                    </td>
                    <td style="cursor: pointer">
                        <label for="light_mode">Light</label>
                    </td>
                    <td style="cursor: pointer">
                        <input type="radio" id="light_mode" name="ld_mode" value="1" onclick="window.enableLightMode();">
                    </td>
                    <td style="cursor: not-allowed;">
                        <label for="dark_mode" style="color: grey">Dark</label>
                    </td>
                    <td style="cursor: not-allowed;">
                        <input type="radio" id="dark_mode" name="ld_mode" value="0" onclick="window.enableDarkMode();" disabled>
                    </td>
                </tr>
                <tr>
                    <td class="td saveclose" colspan="5">
                        <span style="display: inline-block; width: calc(100% - 75px)"></span>
                        <button class="b saveclose" onclick="window.hideOptions();">Close</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Sprite stuff - feel free to comment out/remove if not using -->

    <div id='page'>
        <div id="mid_panel">
            <header>
                <h1 id="game-title">Route to Ítaca</h1>
                <h2 id="game-author">- An Alternate History</h2>

                <div id="header-links">
                    <a id="stats-link" onclick="window.showStats();" href="#">Library</a>
                    <a id="save_link" data-tooltip="Save/Load" onclick="window.openSaveSlots();" href="#">Save/Load</a>
                    <a onclick="window.showOptions();" href="#">Options</a>
                </div>
            </header>
            <div id="tools_wrapper">
                <div id='stats_sidebar' class='tools left'>
                    <div class="tab_container">
                        <button class="tab_button active" id="main_tab" data-tooltip="Main" onclick="window.changeTab('status', 'main_tab');"><img class="status-icon" src="img/home_icon.svg" alt="Main"></button>
                        <button class="tab_button" id="politics_tab" data-tooltip="Politics" onclick="window.changeTab('status.politics', 'politics_tab');"><img class="status-icon" src="img/politics_icon.svg" alt="Politics"></button>
                        <button class="tab_button" id="government_tab" data-tooltip="Government" onclick="window.changeTab('status.government', 'government_tab');"><img class="status-icon" src="img/government_icon.svg" alt="Government"></button>
                        <button class="tab_button" id="international_tab" data-tooltip="International Relations" onclick="window.changeTab('status.international', 'international_tab');"><img class="status-icon" src="img/international_icon.svg" alt="International"></button>
                        <button class="tab_button" id="polls_tab" data-tooltip="Opinion Polls" onclick="window.changeTab('status.polls', 'polls_tab');initCataloniaPolls('cat-polls-widget', dendryUI.dendryEngine.state.qualities);addTooltipEventListeners();"><img class="status-icon" src="img/poll_icon.svg" alt="Polls"></button>
