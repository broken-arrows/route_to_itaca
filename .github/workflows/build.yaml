# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install
        run: npm install
      # build:classic = make-html + the source/lib -> out/html/lib publication
      # and the compiled-game audit. Publishing the game library
      # is NOT optional: out/html/index.html loads lib/{cat_engine,allegiances,
      # index}.js and /out/html/lib/ is gitignored, so running bare make-html
      # here deploys an old shell whose G.* calls all throw into runActions'
      # swallowed catch — a dead simulation that looks alive. The old shell
      # remains supported after the root swap.
      - name: Build game (old shell + game.json)
        run: npm run build:classic
      - name: Copy game.json to output
        run: cp out/game.json out/html/
      # TODO: Uncomment when the new UI is ready
      # - name: Setup node for ui
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      # - name: Install ui deps
      #   run: npm ci
      #   working-directory: ui
      # - name: Test ui
      #   run: npm test
      #   working-directory: ui
      # - name: Build ui
      #   run: npm run build
      #   working-directory: ui
      # - name: Assemble desk beta
      #   run: |
      #     mkdir -p out/html/desk
      #     cp -r ui/dist/. out/html/desk/
      #     cp out/game.json out/html/desk/game.en.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "out/html"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
